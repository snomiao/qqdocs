# Builds the Rust `qqdocs` binary for every platform, packs it together with
# the TypeScript the package ships, checks on Linux that the binary behaves
# like the TypeScript, and checks on Linux, macOS and Windows (x64 and arm64)
# that `bun i -g` / `npm i -g` gives working `qqdocs` and `qqdoc` commands.
#
# It does not publish. Releases still go through release.yml.
#
# The pipeline lives in https://github.com/snomiao/rustify.

name: rust-npm-release

on:
  pull_request:
    paths:
      - "rs/**"
      # The parity cases compare the binary with the TypeScript, so a change
      # to either side has to run them.
      - "src/**"
      - "bin/**"
      - "package.json"
      - ".github/workflows/rust-npm-release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without a leading v (default: the version in rs/Cargo.toml)"
        required: false
        type: string

jobs:
  build:
    uses: snomiao/rustify/.github/workflows/rust-npm-build.yml@releases/v1
    with:
      manifest: rs/Cargo.toml
      bins: qqdocs
      version: ${{ inputs.version }}
      # --help is yargs's, so it is handed to bin/qqdocs.ts on every machine.
      # (--version is no use as the check: installed with bun, yargs cannot
      # find the package and prints "unknown", today as well.)
      smoke: qqdocs --help
      smoke-expect: List live Tencent Docs MCP tools
      # Rust against TypeScript, on the Linux binary that was just built
      # (rs/parity.gen.mjs says how the cases work; no case reaches the real
      # service). First that rs/parity.json is what the generator writes, then
      # the comparison, then which cases the binary answered itself, then the
      # crate's own tests. The repository has no lockfile, hence a plain
      # `bun install`.
      parity: >-
        bun install
        && node rs/parity.gen.mjs --check
        && node "$RUSTIFY_PARITY" --cases rs/parity.json
        --ts "node rs/parity/with-mock.mjs bun bin/qqdocs.ts"
        --rs "node rs/parity/with-mock.mjs env QQDOCS_PACKAGE_ROOT=$GITHUB_WORKSPACE $RUSTIFY_BIN_DIR/qqdocs"
        && node "$RUSTIFY_PARITY" --cases rs/parity.json
        --rs "node rs/parity/with-mock.mjs $RUSTIFY_BIN_DIR/qqdocs"
        --handback QQDOCS_PACKAGE_ROOT=bin/qqdocs.ts
        && cargo test --manifest-path rs/Cargo.toml
      # Run once on every platform after installing; the parity job is Linux
      # only. `usage` and `usage calibrate` are ported and need neither a
      # token nor the network: they read and write ~/.qqdocs/usage.json. The
      # binary answers them where the machine's zone is UTC and the current
      # directory is not inside a JavaScript project; elsewhere (and always on
      # Windows) it hands them back, and the JavaScript prints the same.
      # `tools` without a token is handed back, and the TypeScript reports
      # the missing token before it asks anything.
      smoke-extra: |
        qqdoc --help => List live Tencent Docs MCP tools
        qqdocs usage => API usage (Tencent Docs MCP):
        qqdocs usage calibrate --today 3 => Calibrated: today=3
        qqdoc usage => 3/100
        [1] qqdocs tools => TENCENT_DOCS_TOKEN not set
